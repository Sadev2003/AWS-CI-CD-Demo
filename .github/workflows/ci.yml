name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-app:ci .

      - name: Start container
        run: docker run -d --name test -p 3000:3000 demo-app:ci

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fs http://localhost:3000/health; then
              echo "Healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs test
          exit 1

  push-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "import sys,base64,json;t=sys.stdin.read().strip().split('.')[1];t+='='*(-len(t)%4);c=json.loads(base64.urlsafe_b64decode(t));print('sub:',c['sub']);print('aud:',c['aud']);print('iss:',c['iss'])"

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183783666:role/github-actions-deploy-role
          aws-region: ap-south-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t $REGISTRY/demo-app:$TAG .
          docker push $REGISTRY/demo-app:$TAG
          echo "Pushed demo-app:$TAG"